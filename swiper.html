<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        .swiper {
            width: 100%;
            height: 80vh;
            padding: 38px 0;
            box-sizing: content-box;
        }

        .swiper-slide {
            height: 80vh;
            width: auto;

            margin-right: 16px;
            border-radius: 16px;
            overflow: hidden;
            filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.25)) drop-shadow(2px 2px 5px rgba(0, 0, 0, 0.15))
        }

        .poster {
            object-fit: contain;
            height: 80vh;
        }
    </style>
</head>

<body>
    <!-- Slider main container -->
    <div class="swiper">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_Bootleggers.webp" alt="" class="poster"></div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_Cheese-and-Wine.webp" alt="" class="poster">
            </div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_Golden-Girls.webp" alt="" class="poster"></div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_Grapevine.webp" alt="" class="poster"></div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_Nile.webp" alt="" class="poster"></div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_PW_Boxing.webp" alt="" class="poster"></div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_PW_Intergalactic.webp" alt="" class="poster">
            </div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_PW_Kaiju-Mech.webp" alt="" class="poster">
            </div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_PW_Kaiju.webp" alt="" class="poster"></div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_PW_Western.webp" alt="" class="poster"></div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_Pym-Rae.webp" alt="" class="poster"></div>
            <div class="swiper-slide"><img src="/Graphics/Posters/Poster_Winefest.webp" alt="" class="poster"></div>
        </div>
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>

        <!-- If we need navigation buttons -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- If we need scrollbar -->
        <!-- <div class="swiper-scrollbar"></div> -->
    </div>





    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
            // Optional parameters
            direction: 'horizontal',
            loop: true,
            slidesPerView: "auto",
            spaceBetween: 16,
            centeredSlides: true,

            // If we need pagination
            pagination: {
                el: '.swiper-pagination',
            },

            // Navigation arrows
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },

            // And if we need scrollbar
            /* scrollbar: {
                el: '.swiper-scrollbar',
            }, */
        });

    </script>

</body>

</html>
